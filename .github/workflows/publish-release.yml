name: Publish Kodi Repository

# Триггеры / Triggers
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Права доступа для GitHub Pages / Permissions for GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Предотвращение одновременных деплоев / Prevent concurrent deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy Repository
    runs-on: ubuntu-latest
    
    steps:
      # Шаг 1: Checkout репозитория / Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Шаг 2: Настройка Python / Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'  # Minimum version for Path.is_relative_to()

      # Шаг 3: Создание структуры директорий / Step 3: Create directory structure
      - name: Create output directories
        run: |
          echo "Creating output directory structure..."
          mkdir -p docs/doc
          
          # Список аддонов для обработки / List of addons to process
          ADDONS=(
            "context.seranov.screenshots"
            "plugin.video.seranov.recursive"
            "plugin.video.seranov.browser"
            "service.seranov.nfoscanner"
            "repository.seranov"
          )
          
          # Создание поддиректорий для каждого аддона в docs / Create subdirectories for each addon in docs
          for addon in "${ADDONS[@]}"; do
            mkdir -p "docs/$addon"
            echo "Created directory: docs/$addon"
          done

      # Шаг 4: Создание ZIP-архивов / Step 4: Create ZIP archives
      - name: Create addon ZIP archives
        run: |
          echo "Creating ZIP archives for addons..."
          
          # Функция для создания ZIP архива / Function to create ZIP archive
          create_addon_zip() {
            local addon_dir="$1"
            local addon_id
            addon_id=$(basename "$addon_dir")
            
            # Проверка наличия addon.xml / Check if addon.xml exists
            if [ ! -f "$addon_dir/addon.xml" ]; then
              echo "Warning: $addon_dir/addon.xml not found, skipping..."
              return
            fi
            
            # Извлечение версии из addon.xml / Extract version from addon.xml
            local version
            version=$(python3 -c 'import xml.etree.ElementTree as ET; import sys; tree = ET.parse(sys.argv[1]); root = tree.getroot(); print(root.get("version"))' "$addon_dir/addon.xml")
            
            echo "Processing $addon_id version $version..."
            
            # Создание ZIP архива в подпапке аддона / Create ZIP archive in addon subfolder
            local zip_name="${addon_id}-${version}.zip"
            local zip_path="docs/$addon_id/${zip_name}"
            
            # Удаление старого архива если есть / Remove old archive if exists
            rm -f "$zip_path"
            
            # Создание временной директории / Create temporary directory
            local temp_dir
            temp_dir=$(mktemp -d)
            mkdir -p "$temp_dir/$addon_id"
            
            # Копирование файлов аддона (исключая скрытые файлы и __pycache__) 
            # Copy addon files (excluding hidden files and __pycache__)
            rsync -a --exclude='.*' --exclude='__pycache__' --exclude='*.pyc' "$addon_dir/" "$temp_dir/$addon_id/"
            
            # Создание ZIP архива / Create ZIP archive
            cd "$temp_dir" || exit 1
            zip -q -r "$zip_name" "$addon_id" -x "*/\.*" "*/__pycache__/*" "*.pyc"
            mv "$zip_name" "$GITHUB_WORKSPACE/$zip_path"
            cd "$GITHUB_WORKSPACE" || exit 1
            
            # Очистка временной директории / Clean up temporary directory
            rm -rf "$temp_dir"
            
            echo "Created: $zip_path"
            
            # Копирование icon.png если есть / Copy icon.png if exists
            if [ -f "$addon_dir/icon.png" ]; then
              cp "$addon_dir/icon.png" "docs/$addon_id/"
              echo "Copied icon.png for $addon_id"
            fi
            
            # Копирование fanart.jpg если есть / Copy fanart.jpg if exists
            if [ -f "$addon_dir/fanart.jpg" ]; then
              cp "$addon_dir/fanart.jpg" "docs/$addon_id/"
              echo "Copied fanart.jpg for $addon_id"
            fi
          }
          
          # Обработка всех директорий аддонов / Process all addon directories
          for addon_dir in plugin.* service.* context.* repository.*; do
            if [ -d "$addon_dir" ]; then
              create_addon_zip "$addon_dir"
            fi
          done
          
          echo "All ZIP archives created successfully!"
          
          # Создание копии repository.seranov.zip без версии в корне / Create versionless copy of repository.seranov.zip in root
          echo "Creating versionless copy of repository.seranov in root..."
          REPO_ZIP=$(find docs/repository.seranov/ -name "repository.seranov-*.zip" -type f | head -n 1)
          if [ -n "$REPO_ZIP" ]; then
            cp "$REPO_ZIP" "docs/repository.seranov.zip"
            echo "Created: docs/repository.seranov.zip (copied from $(basename "$REPO_ZIP"))"
          else
            echo "Warning: repository.seranov ZIP not found in docs/repository.seranov/"
          fi

      # Шаг 5: Генерация addons.xml для docs / Step 5: Generate addons.xml for docs
      - name: Generate addons.xml for docs
        run: |
          echo "Generating addons.xml for docs..."
          
          python3 << 'PYTHON_SCRIPT'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          import sys
          
          def indent_xml(elem, level=0):
              """Add pretty-printing indentation to XML"""
              indent = "\n" + "    " * level
              if len(elem):
                  if not elem.text or not elem.text.strip():
                      elem.text = indent + "    "
                  if not elem.tail or not elem.tail.strip():
                      elem.tail = indent
                  for child in elem:
                      indent_xml(child, level + 1)
                  if len(elem) > 0:
                      last_child = elem[-1]
                      if not last_child.tail or not last_child.tail.strip():
                          last_child.tail = indent
              else:
                  if level and (not elem.tail or not elem.tail.strip()):
                      elem.tail = indent
          
          # Создание корневого элемента / Create root element
          root = ET.Element('addons')
          
          # Список аддонов / List of addons
          addon_dirs = []
          base_path = Path('.')
          
          for item in base_path.iterdir():
              if item.is_dir() and (
                  item.name.startswith('plugin.') or 
                  item.name.startswith('service.') or 
                  item.name.startswith('context.') or 
                  item.name.startswith('repository.')
              ):
                  addon_xml = item / 'addon.xml'
                  if addon_xml.exists():
                      addon_dirs.append(item)
          
          print(f"Found {len(addon_dirs)} addons")
          
          # Добавление каждого аддона в addons.xml / Add each addon to addons.xml
          for addon_dir in sorted(addon_dirs):
              try:
                  tree = ET.parse(addon_dir / 'addon.xml')
                  addon_element = tree.getroot()
                  root.append(addon_element)
                  print(f"Added {addon_element.get('id')} version {addon_element.get('version')}")
              except Exception as e:
                  print(f"Error processing {addon_dir}: {e}", file=sys.stderr)
                  sys.exit(1)
          
          # Форматирование и сохранение / Format and save
          indent_xml(root)
          tree = ET.ElementTree(root)
          
          output_path = Path('docs/addons.xml')
          tree.write(output_path, encoding='utf-8', xml_declaration=True)
          
          print(f"Generated: {output_path}")
          PYTHON_SCRIPT
          
          echo "✓ addons.xml generated successfully!"

      # Шаг 6: Генерация addons.xml.md5 / Step 6: Generate addons.xml.md5
      - name: Generate addons.xml.md5
        run: |
          echo "Generating addons.xml.md5..."
          
          cd docs
          md5sum addons.xml | awk '{print $1}' > addons.xml.md5
          
          echo "MD5 checksum: $(cat addons.xml.md5)"
          echo "addons.xml.md5 generated successfully!"

      # Шаг 7: Создание .nojekyll файла / Step 7: Create .nojekyll file
      - name: Create .nojekyll file
        run: |
          echo "Creating .nojekyll file to disable Jekyll..."
          touch docs/.nojekyll
          echo "✓ .nojekyll file created!"

      # Шаг 8: Конвертация документации из MD в HTML / Step 8: Convert documentation from MD to HTML
      - name: Convert documentation to HTML
        run: |
          echo "Converting documentation from Markdown to HTML..."
          python3 scripts/convert_md_to_html.py doc docs/doc
          echo "✓ Documentation converted to HTML!"

      # Шаг 9: Генерация readme.html / Step 9: Generate readme.html
      - name: Generate readme.html
        run: |
          echo "Generating readme.html with plugin links..."
          python3 scripts/generate_readme.py docs
          echo "✓ readme.html generated!"

      # Шаг 10: Генерация корневого index.html / Step 10: Generate root index.html
      - name: Generate root index.html
        run: |
          echo "Generating root index.html with plugin archive links..."
          
          # Создание заголовка файла / Create file header
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Seranov Kodi Repository</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; max-width: 1200px; }
                  h1 { color: #333; border-bottom: 2px solid #0066cc; padding-bottom: 10px; }
                  h2 { color: #555; margin-top: 30px; }
                  a { color: #0066cc; text-decoration: none; }
                  a:hover { text-decoration: underline; }
                  ul { list-style-type: none; padding-left: 0; }
                  li { padding: 5px 0; }
                  .description { color: #666; margin-bottom: 30px; }
              </style>
          </head>
          <body>
              <h1>Seranov Kodi Repository</h1>
              <p class="description">Collection of custom Kodi addons for video playback and browsing.</p>
              
              <h2>Repository Installation:</h2>
              <p>To install this repository in Kodi, download the following file and install it as a ZIP package:</p>
              <ul>
          EOF
          
          # Добавление ссылки на repository.seranov.zip первой / Add repository.seranov.zip link first
          if [ -f "docs/repository.seranov.zip" ]; then
            echo "        <li><a href=\"repository.seranov.zip\">repository.seranov.zip</a> (latest)</li>" >> docs/index.html
            echo "Added link: repository.seranov.zip (first)"
          fi
          
          cat >> docs/index.html << 'EOF'
              </ul>
              
              <h2>Addon Directories:</h2>
              <p>Browse individual addon directories to view and download specific versions:</p>
              <ul>
          EOF
          
          # Добавление ссылок на директории аддонов / Add links to addon directories
          for addon_dir in docs/*/; do
            if [ -d "$addon_dir" ]; then
              addon_name=$(basename "$addon_dir")
              echo "        <li><a href=\"$addon_name/\">$addon_name/</a></li>" >> docs/index.html
              echo "Added directory link: $addon_name/"
            fi
          done
          
          cat >> docs/index.html << 'EOF'
              </ul>
              
              <h2>Repository Files:</h2>
              <ul>
                  <li><a href="addons.xml">addons.xml</a> - Addon metadata</li>
                  <li><a href="readme.html">readme.html</a> - Repository documentation</li>
              </ul>
          </body>
          </html>
          EOF
          
          echo "✓ Root index.html generated!"

      # Шаг 11: Генерация index.html для аддонов / Step 11: Generate index.html for addons
      - name: Generate addon index pages
        run: |
          echo "Generating index.html pages for addon directories..."
          
          # Список аддонов для обработки / List of addons to process
          ADDONS=(
            "context.seranov.screenshots"
            "plugin.video.seranov.recursive"
            "plugin.video.seranov.browser"
            "service.seranov.nfoscanner"
            "repository.seranov"
          )
          
          for addon_id in "${ADDONS[@]}"; do
            if [ -d "docs/$addon_id" ]; then
              echo "Generating index.html for $addon_id..."
              
              # Создание начала HTML файла / Create HTML file header
              cat > "docs/$addon_id/index.html" << EOF
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>$addon_id - Seranov Kodi Repository</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
                  h1 { color: #333; }
                  h2 { color: #555; margin-top: 20px; }
                  a { color: #0066cc; text-decoration: none; }
                  a:hover { text-decoration: underline; }
                  ul { list-style-type: none; padding-left: 0; }
                  li { padding: 5px 0; }
                  .back-link { margin-bottom: 20px; }
              </style>
          </head>
          <body>
              <h1>$addon_id</h1>
              <p class="back-link"><a href="../">← Back to repository</a></p>
          EOF
              
              # Подсчёт файлов по типам / Count files by type
              zip_count=$(ls docs/$addon_id/*.zip 2>/dev/null | wc -l)
              media_count=$(ls docs/$addon_id/*.{png,jpg,jpeg,gif} 2>/dev/null | wc -l)
              
              # Добавление секции с ZIP файлами если они есть / Add ZIP files section if any
              if [ "$zip_count" -gt 0 ]; then
                cat >> "docs/$addon_id/index.html" << EOF
              
              <h2>Installation Files:</h2>
              <ul>
          EOF
                for file in docs/$addon_id/*.zip; do
                  if [ -f "$file" ]; then
                    filename=$(basename "$file")
                    filesize=$(du -h "$file" | cut -f1)
                    echo "        <li><a href=\"$filename\">$filename</a> ($filesize)</li>" >> "docs/$addon_id/index.html"
                  fi
                done
                echo "              </ul>" >> "docs/$addon_id/index.html"
              fi
              
              # Добавление секции с медиа файлами если они есть / Add media files section if any
              if [ "$media_count" -gt 0 ]; then
                cat >> "docs/$addon_id/index.html" << EOF
              
              <h2>Media Files:</h2>
              <ul>
          EOF
                for file in docs/$addon_id/*.{png,jpg,jpeg,gif}; do
                  if [ -f "$file" ]; then
                    filename=$(basename "$file")
                    echo "        <li><a href=\"$filename\">$filename</a></li>" >> "docs/$addon_id/index.html"
                  fi
                done
                echo "              </ul>" >> "docs/$addon_id/index.html"
              fi
              
              # Проверка наличия других файлов / Check for other files
              other_files=()
              for file in docs/$addon_id/*; do
                if [ -f "$file" ]; then
                  filename=$(basename "$file")
                  if [ "$filename" != "index.html" ] && \
                     [[ "$filename" != *.zip ]] && \
                     [[ "$filename" != *.png ]] && \
                     [[ "$filename" != *.jpg ]] && \
                     [[ "$filename" != *.jpeg ]] && \
                     [[ "$filename" != *.gif ]]; then
                    other_files+=("$filename")
                  fi
                fi
              done
              
              # Добавление секции с другими файлами если они есть / Add other files section if any
              if [ ${#other_files[@]} -gt 0 ]; then
                cat >> "docs/$addon_id/index.html" << EOF
              
              <h2>Other Files:</h2>
              <ul>
          EOF
                for filename in "${other_files[@]}"; do
                  echo "        <li><a href=\"$filename\">$filename</a></li>" >> "docs/$addon_id/index.html"
                done
                echo "              </ul>" >> "docs/$addon_id/index.html"
              fi
              
              # Закрытие HTML файла / Close HTML file
              cat >> "docs/$addon_id/index.html" << EOF
          </body>
          </html>
          EOF
              
              echo "✓ Created index.html for $addon_id"
            fi
          done
          
          echo "All index pages created successfully!"

      # Шаг 12: Вывод структуры директории / Step 12: Display directory structure
      - name: Display output structure
        run: |
          echo "=== Output Directory Structure ==="
          tree -L 2 docs/ || find docs/ -maxdepth 2 -print
          echo ""
          echo "=== File sizes ==="
          du -h docs/* | sort -h

      # Шаг 13: Настройка GitHub Pages / Step 13: Configure GitHub Pages
      - name: Configure GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Configuring GitHub Pages..."
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' \
            || echo "Pages might already be configured or error occurred"

      # Шаг 14: Deploy на GitHub Pages / Step 14: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          commit_message: "Deploy Kodi repository ${{ github.sha }}"

      # Шаг 15: Вывод информации об успешном деплое / Step 15: Output deployment info
      - name: Deployment complete
        run: |
          echo "✅ Deployment successful!"
          echo ""
          echo "Repository URL: https://seranov.github.io/seranov-kodi/"
          echo ""
          echo "To install in Kodi:"
          echo "1. Download repository.seranov ZIP from the releases"
          echo "2. In Kodi: Add-ons → Install from zip file"
          echo "3. Select the downloaded repository.seranov-*.zip file"
          echo ""
          echo "Files deployed:"
          echo "  - index.html (with links to all addon archives)"
          echo "  - addons.xml"
          echo "  - addons.xml.md5"
          echo "  - ZIP archives for all addons"
          echo "  - Icon files"
