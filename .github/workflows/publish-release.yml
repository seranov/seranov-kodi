name: Publish Kodi Repository

# Триггеры / Triggers
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Права доступа для GitHub Pages / Permissions for GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Предотвращение одновременных деплоев / Prevent concurrent deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy Repository
    runs-on: ubuntu-latest
    
    steps:
      # Шаг 1: Checkout репозитория / Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Шаг 2: Настройка Python / Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'  # Minimum version for Path.is_relative_to()

      # Шаг 3: Создание структуры директорий / Step 3: Create directory structure
      - name: Create output directories
        run: |
          echo "Creating output directory structure..."
          mkdir -p docs/doc
          mkdir -p repo
          
          # Список аддонов для обработки / List of addons to process
          ADDONS=(
            "context.seranov.screenshots"
            "plugin.video.seranov.recursive"
            "plugin.video.seranov.browser"
            "service.seranov.nfoscanner"
            "repository.seranov"
          )
          
          # Создание поддиректорий для каждого аддона в docs / Create subdirectories for each addon in docs
          for addon in "${ADDONS[@]}"; do
            mkdir -p "docs/$addon"
            echo "Created directory: docs/$addon"
          done
          
          # Создание поддиректорий для каждого аддона в repo / Create subdirectories for each addon in repo
          for addon in "${ADDONS[@]}"; do
            mkdir -p "repo/$addon"
            echo "Created directory: repo/$addon"
          done

      # Шаг 4: Создание ZIP-архивов / Step 4: Create ZIP archives
      - name: Create addon ZIP archives
        run: |
          echo "Creating ZIP archives for addons..."
          
          # Функция для создания ZIP архива / Function to create ZIP archive
          create_addon_zip() {
            local addon_dir="$1"
            local addon_id
            addon_id=$(basename "$addon_dir")
            
            # Проверка наличия addon.xml / Check if addon.xml exists
            if [ ! -f "$addon_dir/addon.xml" ]; then
              echo "Warning: $addon_dir/addon.xml not found, skipping..."
              return
            fi
            
            # Извлечение версии из addon.xml / Extract version from addon.xml
            local version
            version=$(python3 -c 'import xml.etree.ElementTree as ET; import sys; tree = ET.parse(sys.argv[1]); root = tree.getroot(); print(root.get("version"))' "$addon_dir/addon.xml")
            
            echo "Processing $addon_id version $version..."
            
            # Создание ZIP архива в корне docs / Create ZIP archive in docs root
            local zip_name="${addon_id}-${version}.zip"
            local zip_path="docs/${zip_name}"
            
            # Удаление старого архива если есть / Remove old archive if exists
            rm -f "$zip_path"
            
            # Создание временной директории / Create temporary directory
            local temp_dir
            temp_dir=$(mktemp -d)
            mkdir -p "$temp_dir/$addon_id"
            
            # Копирование файлов аддона (исключая скрытые файлы и __pycache__) 
            # Copy addon files (excluding hidden files and __pycache__)
            rsync -a --exclude='.*' --exclude='__pycache__' --exclude='*.pyc' "$addon_dir/" "$temp_dir/$addon_id/"
            
            # Создание ZIP архива / Create ZIP archive
            cd "$temp_dir" || exit 1
            zip -q -r "$zip_name" "$addon_id" -x "*/\.*" "*/__pycache__/*" "*.pyc"
            mv "$zip_name" "$GITHUB_WORKSPACE/$zip_path"
            cd "$GITHUB_WORKSPACE" || exit 1
            
            # Очистка временной директории / Clean up temporary directory
            rm -rf "$temp_dir"
            
            echo "Created: $zip_path"
            
            # Копирование ZIP архива в подпапку аддона / Copy ZIP archive to addon subfolder
            cp "$zip_path" "docs/$addon_id/"
            echo "Copied $zip_name to docs/$addon_id/"
            
            # Копирование icon.png если есть / Copy icon.png if exists
            if [ -f "$addon_dir/icon.png" ]; then
              cp "$addon_dir/icon.png" "docs/$addon_id/"
              echo "Copied icon.png for $addon_id"
            fi
            
            # Копирование fanart.jpg если есть / Copy fanart.jpg if exists
            if [ -f "$addon_dir/fanart.jpg" ]; then
              cp "$addon_dir/fanart.jpg" "docs/$addon_id/"
              echo "Copied fanart.jpg for $addon_id"
            fi
          }
          
          # Обработка всех директорий аддонов / Process all addon directories
          for addon_dir in plugin.* service.* context.* repository.*; do
            if [ -d "$addon_dir" ]; then
              create_addon_zip "$addon_dir"
            fi
          done
          
          echo "All ZIP archives created successfully!"
          
          # Создание копии repository.seranov.zip без версии / Create copy of repository.seranov.zip without version
          echo "Creating versionless copy of repository.seranov..."
          REPO_ZIP=$(find docs/ -maxdepth 1 -name "repository.seranov-*.zip" | head -n 1)
          if [ -n "$REPO_ZIP" ]; then
            cp "$REPO_ZIP" "docs/repository.seranov.zip"
            echo "Created: docs/repository.seranov.zip"
          else
            echo "Warning: repository.seranov ZIP not found"
          fi

      # Шаг 5: Обновление временной папки repo / Step 5: Update temporary repo folder
      - name: Update temporary repo folder
        run: |
          echo "Updating temporary repo folder with new archives..."
          
          # Список аддонов для обработки / List of addons to process
          ADDONS=(
            "context.seranov.screenshots"
            "plugin.video.seranov.recursive"
            "plugin.video.seranov.browser"
            "service.seranov.nfoscanner"
            "repository.seranov"
          )
          
          # Обновление архивов для каждого аддона / Update archives for each addon
          for addon_id in "${ADDONS[@]}"; do
            if [ -d "repo/$addon_id" ]; then
              echo "Processing $addon_id in repo folder..."
              
              # Удаление старых ZIP архивов / Remove old ZIP archives
              rm -f repo/$addon_id/*.zip
              echo "  Removed old ZIP archives for $addon_id"
              
              # Копирование новых ZIP архивов из docs / Copy new ZIP archives from docs
              for zipfile in docs/${addon_id}-*.zip; do
                if [ -f "$zipfile" ]; then
                  cp "$zipfile" "repo/$addon_id/"
                  echo "  Copied $(basename "$zipfile") to repo/$addon_id/"
                fi
              done
              
              # Копирование icon.png если есть и его нет в repo / Copy icon.png if exists and not in repo
              if [ -f "$addon_id/icon.png" ] && [ ! -f "repo/$addon_id/icon.png" ]; then
                cp "$addon_id/icon.png" "repo/$addon_id/"
                echo "  Copied icon.png to repo/$addon_id/"
              fi
              
              # Копирование fanart.jpg если есть и его нет в repo / Copy fanart.jpg if exists and not in repo
              if [ -f "$addon_id/fanart.jpg" ] && [ ! -f "repo/$addon_id/fanart.jpg" ]; then
                cp "$addon_id/fanart.jpg" "repo/$addon_id/"
                echo "  Copied fanart.jpg to repo/$addon_id/"
              fi
            else
              echo "Warning: repo/$addon_id directory does not exist, skipping..."
            fi
          done
          
          echo "✓ Temporary repo folder updated with new archives!"

      # Шаг 6: Обновление repo/addons.xml / Step 6: Update repo/addons.xml
      - name: Update repo/addons.xml
        run: |
          echo "Updating repo/addons.xml..."
          
          python3 << 'PYTHON_SCRIPT'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          import sys
          
          def indent_xml(elem, level=0):
              """Add pretty-printing indentation to XML"""
              indent = "\n" + "    " * level
              if len(elem):
                  if not elem.text or not elem.text.strip():
                      elem.text = indent + "    "
                  if not elem.tail or not elem.tail.strip():
                      elem.tail = indent
                  for child in elem:
                      indent_xml(child, level + 1)
                  if len(elem) > 0:
                      last_child = elem[-1]
                      if not last_child.tail or not last_child.tail.strip():
                          last_child.tail = indent
              else:
                  if level and (not elem.tail or not elem.tail.strip()):
                      elem.tail = indent
          
          # Создание корневого элемента / Create root element
          root = ET.Element('addons')
          
          # Список аддонов / List of addons
          addon_dirs = []
          base_path = Path('.')
          
          for item in base_path.iterdir():
              if item.is_dir() and (
                  item.name.startswith('plugin.') or 
                  item.name.startswith('service.') or 
                  item.name.startswith('context.') or 
                  item.name.startswith('repository.')
              ):
                  addon_xml = item / 'addon.xml'
                  if addon_xml.exists():
                      addon_dirs.append(item)
          
          print(f"Found {len(addon_dirs)} addons")
          
          # Добавление каждого аддона в addons.xml / Add each addon to addons.xml
          for addon_dir in sorted(addon_dirs):
              try:
                  tree = ET.parse(addon_dir / 'addon.xml')
                  addon_element = tree.getroot()
                  root.append(addon_element)
                  print(f"Added {addon_element.get('id')} version {addon_element.get('version')}")
              except Exception as e:
                  print(f"Error processing {addon_dir}: {e}", file=sys.stderr)
                  sys.exit(1)
          
          # Форматирование и сохранение / Format and save
          indent_xml(root)
          tree = ET.ElementTree(root)
          
          output_path = Path('repo/addons.xml')
          tree.write(output_path, encoding='utf-8', xml_declaration=True)
          
          print(f"Updated: {output_path}")
          PYTHON_SCRIPT
          
          echo "✓ repo/addons.xml updated successfully!"

      # Шаг 7: Обновление repo/addons.xml.md5 / Step 7: Update repo/addons.xml.md5
      - name: Update repo/addons.xml.md5
        run: |
          echo "Updating repo/addons.xml.md5..."
          
          cd repo
          md5sum addons.xml | awk '{print $1}' > addons.xml.md5
          
          echo "MD5 checksum: $(cat addons.xml.md5)"
          echo "✓ repo/addons.xml.md5 updated successfully!"
          cd ..

      # Шаг 8: Генерация addons.xml для docs / Step 8: Generate addons.xml for docs
      - name: Generate addons.xml for docs
        run: |
          echo "Generating addons.xml for docs..."
          
          python3 << 'PYTHON_SCRIPT'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          import sys
          
          def indent_xml(elem, level=0):
              """Add pretty-printing indentation to XML"""
              indent = "\n" + "    " * level
              if len(elem):
                  if not elem.text or not elem.text.strip():
                      elem.text = indent + "    "
                  if not elem.tail or not elem.tail.strip():
                      elem.tail = indent
                  for child in elem:
                      indent_xml(child, level + 1)
                  if len(elem) > 0:
                      last_child = elem[-1]
                      if not last_child.tail or not last_child.tail.strip():
                          last_child.tail = indent
              else:
                  if level and (not elem.tail or not elem.tail.strip()):
                      elem.tail = indent
          
          # Создание корневого элемента / Create root element
          root = ET.Element('addons')
          
          # Список аддонов / List of addons
          addon_dirs = []
          base_path = Path('.')
          
          for item in base_path.iterdir():
              if item.is_dir() and (
                  item.name.startswith('plugin.') or 
                  item.name.startswith('service.') or 
                  item.name.startswith('context.') or 
                  item.name.startswith('repository.')
              ):
                  addon_xml = item / 'addon.xml'
                  if addon_xml.exists():
                      addon_dirs.append(item)
          
          print(f"Found {len(addon_dirs)} addons")
          
          # Добавление каждого аддона в addons.xml / Add each addon to addons.xml
          for addon_dir in sorted(addon_dirs):
              try:
                  tree = ET.parse(addon_dir / 'addon.xml')
                  addon_element = tree.getroot()
                  root.append(addon_element)
                  print(f"Added {addon_element.get('id')} version {addon_element.get('version')}")
              except Exception as e:
                  print(f"Error processing {addon_dir}: {e}", file=sys.stderr)
                  sys.exit(1)
          
          # Форматирование и сохранение / Format and save
          indent_xml(root)
          tree = ET.ElementTree(root)
          
          output_path = Path('docs/addons.xml')
          tree.write(output_path, encoding='utf-8', xml_declaration=True)
          
          print(f"Generated: {output_path}")
          PYTHON_SCRIPT
          
          echo "✓ addons.xml for docs generated successfully!"

      # Шаг 9: Генерация addons.xml.md5 для docs / Step 9: Generate addons.xml.md5 for docs
      - name: Generate addons.xml.md5
        run: |
          echo "Generating addons.xml.md5..."
          
          cd docs
          md5sum addons.xml | awk '{print $1}' > addons.xml.md5
          
          echo "MD5 checksum: $(cat addons.xml.md5)"
          echo "addons.xml.md5 generated successfully!"

      # Шаг 10: Создание .nojekyll файла / Step 10: Create .nojekyll file
      - name: Create .nojekyll file
        run: |
          echo "Creating .nojekyll file to disable Jekyll..."
          touch docs/.nojekyll
          echo "✓ .nojekyll file created!"

      # Шаг 11: Конвертация документации из MD в HTML / Step 11: Convert documentation from MD to HTML
      - name: Convert documentation to HTML
        run: |
          echo "Converting documentation from Markdown to HTML..."
          python3 scripts/convert_md_to_html.py doc docs/doc
          echo "✓ Documentation converted to HTML!"

      # Шаг 12: Генерация readme.html / Step 12: Generate readme.html
      - name: Generate readme.html
        run: |
          echo "Generating readme.html with plugin links..."
          python3 scripts/generate_readme.py docs
          echo "✓ readme.html generated!"

      # Шаг 13: Генерация корневого index.html / Step 13: Generate root index.html
      - name: Generate root index.html
        run: |
          echo "Generating root index.html with plugin archive links..."
          
          # Создание заголовка файла / Create file header
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <title>Seranov Kodi Repository</title>
          </head>
          <body>
              <h1>Seranov Kodi Repository</h1>
              
              <h2>Repository Installation:</h2>
              <ul>
          EOF
          
          # Добавление ссылки на repository.seranov.zip первой / Add repository.seranov.zip link first
          if [ -f "docs/repository.seranov.zip" ]; then
            echo "        <li><a href=\"repository.seranov.zip\">repository.seranov.zip</a> (latest)</li>" >> docs/index.html
            echo "Added link: repository.seranov.zip (first)"
          fi
          
          # Добавление ссылки на repository.seranov-X.X.X.zip второй / Add repository.seranov-X.X.X.zip link second
          REPO_VERSIONED_ZIP=$(find docs/ -maxdepth 1 -name "repository.seranov-*.zip" -type f | head -n 1)
          if [ -n "$REPO_VERSIONED_ZIP" ]; then
            REPO_VERSIONED_NAME=$(basename "$REPO_VERSIONED_ZIP")
            echo "        <li><a href=\"$REPO_VERSIONED_NAME\">$REPO_VERSIONED_NAME</a></li>" >> docs/index.html
            echo "Added link: $REPO_VERSIONED_NAME (second)"
          fi
          
          cat >> docs/index.html << 'EOF'
              </ul>
              
              <h2>Addon Archives:</h2>
              <ul>
          EOF
          
          # Добавление ссылок на остальные архивы / Add links to other archives
          for zipfile in docs/*.zip; do
            if [ -f "$zipfile" ]; then
              zipname=$(basename "$zipfile")
              
              # Пропуск уже добавленных repository.seranov файлов / Skip already added repository.seranov files
              if [ "$zipname" = "repository.seranov.zip" ] || [[ "$zipname" == repository.seranov-*.zip ]]; then
                continue
              fi
              
              echo "        <li><a href=\"$zipname\">$zipname</a></li>" >> docs/index.html
              echo "Added link: $zipname"
            fi
          done
          
          cat >> docs/index.html << 'EOF'
              </ul>
              
              <h2>Addon Directories:</h2>
              <ul>
          EOF
          
          # Добавление ссылок на директории аддонов / Add links to addon directories
          for addon_dir in docs/*/; do
            if [ -d "$addon_dir" ]; then
              addon_name=$(basename "$addon_dir")
              echo "        <li><a href=\"$addon_name/\">$addon_name/</a></li>" >> docs/index.html
              echo "Added directory link: $addon_name/"
            fi
          done
          
          cat >> docs/index.html << 'EOF'
              </ul>
              
              <h2>Repository Files:</h2>
              <ul>
                  <li><a href="addons.xml">addons.xml</a> - Addon metadata</li>
                  <li><a href="readme.html">readme.html</a> - Repository documentation</li>
              </ul>
          </body>
          </html>
          EOF
          
          echo "✓ Root index.html generated!"

      # Шаг 14: Генерация index.html для аддонов / Step 14: Generate index.html for addons
      - name: Generate addon index pages
        run: |
          echo "Generating index.html pages for addon directories..."
          
          # Список аддонов для обработки / List of addons to process
          ADDONS=(
            "context.seranov.screenshots"
            "plugin.video.seranov.recursive"
            "plugin.video.seranov.browser"
            "service.seranov.nfoscanner"
            "repository.seranov"
          )
          
          for addon_id in "${ADDONS[@]}"; do
            if [ -d "docs/$addon_id" ]; then
              cat > "docs/$addon_id/index.html" << EOF
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <title>$addon_id</title>
          </head>
          <body>
              <h1>$addon_id</h1>
              <p><a href="../">← Back to repository</a></p>
              
              <h2>Addon Archives:</h2>
              <ul>
          EOF
              
              # Добавление ссылок на ZIP файлы / Add links to ZIP files
              for file in docs/$addon_id/*.zip; do
                if [ -f "$file" ]; then
                  filename=$(basename "$file")
                  echo "        <li><a href=\"$filename\">$filename</a></li>" >> "docs/$addon_id/index.html"
                fi
              done
              
              cat >> "docs/$addon_id/index.html" << EOF
              </ul>
              
              <h2>Media Files:</h2>
              <ul>
          EOF
              
              # Добавление ссылок на медиа файлы / Add links to media files
              for file in docs/$addon_id/*.{png,jpg,jpeg,gif}; do
                if [ -f "$file" ]; then
                  filename=$(basename "$file")
                  echo "        <li><a href=\"$filename\">$filename</a></li>" >> "docs/$addon_id/index.html"
                fi
              done
              
              cat >> "docs/$addon_id/index.html" << EOF
              </ul>
              
              <h2>Other Files:</h2>
              <ul>
          EOF
              
              # Добавление ссылок на остальные файлы / Add links to other files
              for file in docs/$addon_id/*; do
                if [ -f "$file" ]; then
                  filename=$(basename "$file")
                  # Пропуск уже добавленных файлов / Skip already added files
                  if [ "$filename" != "index.html" ] && \
                     [[ "$filename" != *.zip ]] && \
                     [[ "$filename" != *.png ]] && \
                     [[ "$filename" != *.jpg ]] && \
                     [[ "$filename" != *.jpeg ]] && \
                     [[ "$filename" != *.gif ]]; then
                    echo "        <li><a href=\"$filename\">$filename</a></li>" >> "docs/$addon_id/index.html"
                  fi
                fi
              done
              
              cat >> "docs/$addon_id/index.html" << EOF
              </ul>
          </body>
          </html>
          EOF
              
              echo "Created index.html for $addon_id"
            fi
          done
          
          echo "All index pages created successfully!"

      # Шаг 15: Вывод структуры директории / Step 15: Display directory structure
      - name: Display output structure
        run: |
          echo "=== Output Directory Structure ==="
          tree -L 2 docs/ || find docs/ -maxdepth 2 -print
          echo ""
          echo "=== File sizes ==="
          du -h docs/* | sort -h

      # Шаг 16: Настройка GitHub Pages / Step 16: Configure GitHub Pages
      - name: Configure GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Configuring GitHub Pages..."
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' \
            || echo "Pages might already be configured or error occurred"

      # Шаг 17: Deploy на GitHub Pages / Step 17: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          commit_message: "Deploy Kodi repository ${{ github.sha }}"

      # Шаг 18: Вывод информации об успешном деплое / Step 18: Output deployment info
      - name: Deployment complete
        run: |
          echo "✅ Deployment successful!"
          echo ""
          echo "Repository URL: https://seranov.github.io/seranov-kodi/"
          echo ""
          echo "To install in Kodi:"
          echo "1. Download repository.seranov ZIP from the releases"
          echo "2. In Kodi: Add-ons → Install from zip file"
          echo "3. Select the downloaded repository.seranov-*.zip file"
          echo ""
          echo "Files deployed:"
          echo "  - index.html (with links to all addon archives)"
          echo "  - addons.xml"
          echo "  - addons.xml.md5"
          echo "  - ZIP archives for all addons"
          echo "  - Icon files"
